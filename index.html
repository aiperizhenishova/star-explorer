<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/assets/orbit-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Arapey:ital@0;1&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Goldman:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <title>Star Explorer</title>

  </head>

  <body>
    <!-- <div id="app"></div> -->
    <!-- <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@latest/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
        }
      }
    </script> -->

    <script type="module" src="./src/main.js"></script>

    <style>
      #star-info-box {
        position: absolute;
        background: rgba(30, 30, 50, 0.9);
        border: 1px solid white;
        padding: 6px 20px;
        color: white;
        font-family: sans-serif;
        max-width: 500px;
        z-index: 1000;
        display: none; 
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(102, 102, 255, 0.5);
        width: 220px;
      }
      #star-info-box p{
        padding: 5px;
      }

      #star-info-box * {
        pointer-events: auto; /* всё внутри окна ловит клики */
      }
      
      #star-info-box button {
        position: absolute;
        top: 5px;
        right: 10px;
        float: right;
        background: none;
        border: none;
        color: white;
        font-size: 1.2em;
        cursor: pointer;
        pointer-events: auto; /* но кнопка ловит клики */
      }

      #distance-box{
        position: fixed;
        display: none;
        top: 5%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 5px 15px;
        color: white;
        font-size: 15px;
        pointer-events: auto; /* ← было none */
        white-space: nowrap;
        z-index: 1000;
      }

  
    </style>
    <div id="root"></div>
    <script type="module" src="/src/components/Main.jsx"></script>

    <div id="distance-box">
    <span id="distance-text"></span>
    <button onclick="window.clearSelection()" style="
        background: none;
        border: none;
        color: white;
        font-size: 1.2em;
        cursor: pointer;
        margin-left: 10px;
      ">✕</button>
    </div>

    <div id="star-info-box">
      <button onclick="window.clearSelection()">x</button>
      <p>HIP: <span id="star-name"></span></p>
      <p>Vmag: <span id="star-vmag"></span></p>
      <p>SpType: <span id="star-sptype"></span></p>
      <p>Distance: <span id="star-distance"></span> pc</p>
      <p>Size: <span id="star-size"></span></p>
      </div>


    
  </body>
</html>
